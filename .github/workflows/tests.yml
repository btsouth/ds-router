name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # No network, no Hermes install, no backend: the suite must pass on a bare
      # machine. Every provider interaction in the tests is stubbed, so a failure
      # here means a real logic regression rather than an environment problem.
      - name: Run the test suite
        run: python3 run_tests.py

      - name: Shell scripts are POSIX
        if: runner.os != 'Windows'
        run: |
          for f in install.sh uninstall.sh ds-switch; do
            sh -n "$f"
          done

      - name: Install shellcheck
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck the scripts
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh uninstall.sh ds-switch

      - name: The installer is safe to dry-run
        if: runner.os != 'Windows'
        run: |
          # The runner has no Hermes CLI, and install.sh refuses to run without
          # one (correctly: ds-router steers Hermes). Stub a launcher so the
          # installer's own logic is what gets exercised, and assert the guarantee
          # that matters: a dry run writes nothing at all.
          mkdir -p "$RUNNER_TEMP/stub"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/stub/hermes"
          chmod +x "$RUNNER_TEMP/stub/hermes"
          PATH="$RUNNER_TEMP/stub:$PATH" ./install.sh --dry-run --no-service
          if [ -e "$HOME/.local/state/ds-router/install-manifest" ]; then
            echo "dry run created a manifest"; exit 1
          fi
          if [ -e "$HOME/.config/systemd/user/ds-router.timer" ]; then
            echo "dry run installed a unit"; exit 1
          fi
